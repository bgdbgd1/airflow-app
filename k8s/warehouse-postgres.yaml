# Demo warehouse DB inside the cluster. For production, swap for Cloud SQL
# and just point the warehouse-db secret's WAREHOUSE_DSN at it.
apiVersion: v1
kind: Service
metadata: { name: warehouse-db, namespace: airflow }
spec:
  selector: { app: warehouse-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: warehouse-db, namespace: airflow }
spec:
  serviceName: warehouse-db
  replicas: 1
  selector: { matchLabels: { app: warehouse-db } }
  template:
    metadata: { labels: { app: warehouse-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: warehouse }
            - { name: POSTGRES_DB, value: warehouse }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: warehouse-db, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 250m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
