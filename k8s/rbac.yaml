# KSA used by the per-file processor pods (Workload Identity -> GCS access).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: airflow
  annotations:
    iam.gke.io/gcp-service-account: GSA_EMAIL   # replaced by gke_setup.sh
---
# Let Airflow worker pods launch/watch/delete the processor pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-launcher, namespace: airflow }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec]
    verbs: [create, get, list, watch, delete, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: worker-pod-launcher, namespace: airflow }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-launcher }
subjects:
  - { kind: ServiceAccount, name: airflow-worker, namespace: airflow }
