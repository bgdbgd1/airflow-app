# Local stack: Airflow 3 (LocalExecutor) + metadata Postgres + warehouse Postgres.
# Data steps run as sibling containers of the csv-processor image (built from ../csv-processor).
# Usage:  docker compose up -d --build   ->  http://localhost:8080
x-airflow-common: &airflow-common
  build: .
  image: airflow-app:local
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local only: no login
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
    PIPELINE_MODE: local
    PROCESSOR_IMAGE: csv-processor:local
    DOCKER_URL: tcp://docker-proxy:2375
    DOCKER_NETWORK: airflow-net
    WAREHOUSE_DSN: postgresql://warehouse:warehouse@warehouse-db:5432/warehouse
    RAW_URI: file:///opt/airflow/data/raw
    PUBLISHED_URI: file:///opt/airflow/data/published
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - pipeline-data:/opt/airflow/data      # same volume is mounted into processor containers
  user: "50000:0"
  depends_on: &airflow-deps
    postgres: { condition: service_healthy }
    warehouse-db: { condition: service_healthy }
    docker-proxy: { condition: service_started }
    volume-init: { condition: service_completed_successfully }

services:
  # Builds the processing image from the separate repo; exits immediately.
  csv-processor-image:
    build: ../csv-processor
    image: csv-processor:local
    entrypoint: ["true"]
    restart: "no"

  # Limited Docker API so Airflow can start/wait/remove processor containers
  # without mounting the raw docker socket into Airflow.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment: { CONTAINERS: 1, IMAGES: 1, POST: 1, NETWORKS: 1, VOLUMES: 1, INFO: 1 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  volume-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/raw/incoming /data/published && chown -R 50000:0 /data"]
    volumes: [pipeline-data:/data]
    restart: "no"

  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 10 }

  warehouse-db:
    image: postgres:16
    environment: { POSTGRES_USER: warehouse, POSTGRES_PASSWORD: warehouse, POSTGRES_DB: warehouse }
    ports: ["5433:5432"]
    volumes: [warehouse-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "warehouse"], interval: 5s, retries: 10 }

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    depends_on: &after-init
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: *after-init
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *after-init
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on: *after-init
    restart: always

networks:
  default:
    name: airflow-net

volumes:
  airflow-db:
  warehouse-db:
  pipeline-data:
    name: pipeline-data
